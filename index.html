<title>Thi HSK 1 · 阅读</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600&display=swap">
<style>
body{margin:0}
[hidden]{display:none!important}

/* Layout: an HSK machine-scored answer sheet (答题卡): questions on the left, the bubble card on the right. */
:root{
  --paper:#f2f4f7;--sheet:#ffffff;--ink:#1b2433;--muted:#5b6677;--rule:#d8dde5;
  --red:#c0363a;--red-soft:#fbeaea;--jade:#1d7a5a;--jade-soft:#e2f2eb;--amber:#a86200;--amber-soft:#fdf1dc;
  --water:#4b9bd6;--wood:#a8744a;
  --ui:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --han:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --han-display:"Noto Serif SC","Songti SC","SimSun",serif;
  --py:"Noto Sans","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#10151c;--sheet:#18202a;--ink:#e5eaf1;--muted:#99a5b4;--rule:#2c3643;
  --red:#ee6a6a;--red-soft:#3a2023;--jade:#4dc59b;--jade-soft:#15302a;--amber:#f0b35a;--amber-soft:#372a15;
  --water:#5aa9e0;--wood:#c08b60;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10151c;--sheet:#18202a;--ink:#e5eaf1;--muted:#99a5b4;--rule:#2c3643;
  --red:#ee6a6a;--red-soft:#3a2023;--jade:#4dc59b;--jade-soft:#15302a;--amber:#f0b35a;--amber-soft:#372a15;
  --water:#5aa9e0;--wood:#c08b60;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--rule)}
.top .in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;letter-spacing:.01em}
.brand .han{font-family:var(--han-display);color:var(--red);font-size:20px}
.top .sp{flex:1}
.who{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who b{color:var(--ink)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;padding:4px 10px;border:1.5px solid var(--rule);border-radius:6px}
.timer.warn{color:var(--amber);border-color:var(--amber);background:var(--amber-soft)}
.timer.crit{color:var(--red);border-color:var(--red);background:var(--red-soft)}
h1{font-size:26px;line-height:1.25;margin:28px 0 6px;text-wrap:balance}
h2{font-size:18px;margin:0 0 10px;text-wrap:balance}
.lead{color:var(--muted);max-width:62ch;margin:0 0 20px}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);padding:10px 18px;border-radius:6px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.small{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
label.f span.h{font-weight:400;color:var(--muted);font-size:13px}
input[type=text],input[type=number],textarea{border:1.5px solid var(--rule);background:var(--sheet);border-radius:6px;padding:10px 12px;width:100%}
input[type=text]:focus,textarea:focus,input[type=number]:focus{border-color:var(--ink);outline:none}
.err{color:var(--red);font-size:13px;min-height:1em}
.note{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.pill.on{color:var(--jade);border-color:var(--jade);background:var(--jade-soft)}
.pill.on::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--jade)}
.sess{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.sesscard{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--sheet);border:1.5px solid var(--rule);border-radius:8px;padding:16px;width:100%}
.sesscard.sel{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.sesscard .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--red);flex:none;margin-top:3px}
.sesscard.sel .dot{background:radial-gradient(circle,var(--red) 45%,transparent 50%)}
.sesscard b{display:block;font-size:16px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--red)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-family:var(--han-display);font-size:40px;color:var(--rule);line-height:1}
/* exam */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;margin-top:20px;align-items:start}
.card{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px}
.card h3{font-family:var(--ui);font-size:15px;margin:0 0 8px;color:var(--red);letter-spacing:.08em}
.card .grp{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.nav button{border:1.5px solid var(--red);color:var(--red);background:transparent;border-radius:4px;padding:4px 0;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.nav button.done{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.nav button.cur{box-shadow:0 0 0 2px var(--amber)}
.card .cnt{font-size:13px;color:var(--muted);margin:10px 0}
.parthead{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.parthead .zh{font-family:var(--han-display);font-size:20px}
.parthead .zh small{font-family:var(--han);font-size:14px;color:var(--muted);margin-left:8px}
.parthead .vi{color:var(--muted);font-size:14px}
.qs{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.q{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:16px;scroll-margin-top:90px}
.q .no{font-weight:700;font-variant-numeric:tabular-nums;color:var(--red);min-width:2.2em}
.p1{display:grid;grid-template-columns:auto 170px minmax(0,1fr) auto;gap:16px;align-items:center}
.p1 .word{font-family:var(--han);font-size:30px}
.bub{display:flex;gap:8px;flex-wrap:wrap}
.bub button{min-width:46px;height:40px;border:1.5px solid var(--red);color:var(--red);background:transparent;border-radius:5px;font-weight:700;font-size:16px}
.bub button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.bub.ro button{cursor:default}
.bub button.ok{background:var(--jade);border-color:var(--jade);color:#fff}
.bub button.bad{background:var(--red);border-color:var(--red);color:#fff}
.pic{position:relative;aspect-ratio:4/3;max-width:100%;border:1px solid var(--rule);border-radius:6px;background:var(--paper);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic .lt{position:absolute;top:4px;left:6px;font-weight:700;color:var(--red);font-size:14px}
.emo{display:flex;align-items:center;justify-content:center;gap:4px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.emo.c1{font-size:64px}.emo.c2{font-size:50px}.emo.c3{font-size:40px}.emo.c4{font-size:32px}
.pic svg{width:86%;height:86%}
.scene{position:relative;width:100%;height:100%}
.scene svg{position:absolute;inset:7%}
.scene .on{position:absolute;left:50%;transform:translateX(-50%);font-size:40px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.withemo{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;height:100%}
.withemo svg{width:58%;height:80%}
.withemo span{font-size:40px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px}
.ex .q{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center;padding:10px;background:var(--paper)}
.ex .q .word{font-family:var(--han);font-size:22px}
.optgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.optlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin-top:14px;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px 16px}
.optlist div{display:flex;gap:10px;align-items:baseline;min-width:0}
.optlist b{color:var(--red);min-width:1.2em}
.sent{display:flex;gap:10px;align-items:baseline;min-width:0}
.sent .zh{font-family:var(--han);font-size:22px;line-height:2.1;min-width:0}
.q .bub{margin-top:10px}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--red);text-align:center;margin:0 4px;color:var(--ink)}
ruby{ruby-position:over;margin-inline:.1em}
rt{font-family:var(--py);font-size:.42em;color:var(--muted);letter-spacing:0;font-weight:400}
.nopy rt{visibility:hidden}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.warnbar{margin-top:14px;padding:10px 14px;border-radius:6px;background:var(--amber-soft);color:var(--amber);font-weight:600;font-size:14px}
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dialog{background:var(--sheet);border-radius:10px;padding:22px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
/* result */
.score{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.score .n{font-size:64px;font-weight:700;line-height:1}
.score .d{font-size:22px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--rule);padding:8px 10px;text-align:left;font-size:14px;vertical-align:top}
th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right}
.tbl{overflow-x:auto}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;background:var(--paper);border:1px dashed var(--rule);border-radius:6px;padding:10px}
.ok-t{color:var(--jade);font-weight:600}.bad-t{color:var(--red);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin:24px 0 16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:12px}
.stat .k{font-size:12px;color:var(--muted)}.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.tset{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:6px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.review .q{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px}
@media (max-width:820px){
  .exam{grid-template-columns:minmax(0,1fr)}
  .card{position:static;order:-1}
  .nav{grid-template-columns:repeat(10,1fr)}
  .p1{grid-template-columns:auto minmax(0,1fr);}
  .p1 .pic{grid-column:1/-1}
  .p1 .word{grid-column:1/-1}
  .p1 .bub{grid-column:1/-1}
  .optgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .optlist{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:480px){.nav{grid-template-columns:repeat(5,1fr)}h1{font-size:22px}.p1 .word{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ========= TIỆN ÍCH ========= */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function byId(list,id){for(var i=0;i<list.length;i++)if(list[i].id===id)return list[i];return null}
function fmt(n){return (Math.round(n*10)/10).toFixed(1).replace(".",",")}
function lsGet(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function tstr(ts){if(!ts)return "";var d=new Date(ts);function p(n){return n<10?"0"+n:n}return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes())}
function mmss(ms){ms=Math.max(0,ms);var s=Math.floor(ms/1000);var m=Math.floor(s/60);s=s%60;return (m<10?"0"+m:m)+":"+(s<10?"0"+s:s)}
var PUNCT=/[，。？！、：；（）《》“”…·,.?!:;()\s]/;
/* chữ Hán + pinyin theo từng chữ (ruby) */
function rb(hz,py,fill){
  var syl=py.split(/\s+/).filter(Boolean),i=0,out="";
  var chars=Array.from(hz);
  for(var k=0;k<chars.length;k++){var c=chars[k];
    if(c==="_"){out+='<span class="blank">'+(fill||"&nbsp;")+"</span>";continue}
    if(PUNCT.test(c)){out+=esc(c);continue}
    out+="<ruby>"+esc(c)+"<rt>"+esc(syl[i++]||"")+"</rt></ruby>";
  }
  return out;
}
function ruby(o){return rb(o.hz,o.py)}

function emo(list){var c=Math.min(list.length,4);return '<div class="emo c'+c+'">'+list.map(function(x){return "<span>"+x+"</span>"}).join("")+"</div>"}
function svgCal(m,d){return '<svg viewBox="0 0 120 90" aria-hidden="true"><rect x="32" y="12" width="56" height="70" rx="6" style="fill:var(--sheet);stroke:var(--ink);stroke-width:2"/><path d="M32 18a6 6 0 0 1 6-6h44a6 6 0 0 1 6 6v12H32z" style="fill:var(--red)"/><circle cx="46" cy="10" r="3" style="fill:var(--ink)"/><circle cx="74" cy="10" r="3" style="fill:var(--ink)"/><text x="60" y="26" text-anchor="middle" style="fill:#fff;font:600 11px var(--han)">'+m+'月</text><text x="60" y="66" text-anchor="middle" style="fill:var(--ink);font:700 30px var(--han)">'+d+'</text><text x="60" y="78" text-anchor="middle" style="fill:var(--muted);font:500 9px var(--han)">日</text></svg>'}
function svgClock(h,mi){var ha=((h%12)+mi/60)*30,ma=mi*6,t="";for(var i=0;i<12;i++){var a=i*30*Math.PI/180;t+='<line x1="'+(60+Math.sin(a)*30).toFixed(1)+'" y1="'+(45-Math.cos(a)*30).toFixed(1)+'" x2="'+(60+Math.sin(a)*35).toFixed(1)+'" y2="'+(45-Math.cos(a)*35).toFixed(1)+'" style="stroke:var(--ink);stroke-width:'+(i%3?1.5:3)+'"/>'}
 function hand(a,l,w){a=a*Math.PI/180;return '<line x1="60" y1="45" x2="'+(60+Math.sin(a)*l).toFixed(1)+'" y2="'+(45-Math.cos(a)*l).toFixed(1)+'" style="stroke:var(--ink);stroke-width:'+w+';stroke-linecap:round"/>'}
 return '<svg viewBox="0 0 120 90" aria-hidden="true"><circle cx="60" cy="45" r="40" style="fill:var(--sheet);stroke:var(--ink);stroke-width:3"/>'+t+hand(ha,20,4)+hand(ma,30,2.5)+'<circle cx="60" cy="45" r="3" style="fill:var(--red)"/></svg>'}
function svgCup(){return '<svg viewBox="0 0 120 90" aria-hidden="true"><path d="M38 22h40v44a10 10 0 0 1-10 10H48a10 10 0 0 1-10-10z" style="fill:var(--sheet);stroke:var(--ink);stroke-width:3"/><path d="M78 32h6a10 10 0 0 1 0 20h-6" style="fill:none;stroke:var(--ink);stroke-width:3"/><line x1="38" y1="30" x2="78" y2="30" style="stroke:var(--red);stroke-width:2"/></svg>'}
function svgGlass(lv){var top=16,bot=80,y=bot-(bot-top)*lv;function x(yy,left){var f=(yy-top)/(bot-top);return left?40+f*6:80-f*6}
 return '<svg viewBox="0 0 120 90" aria-hidden="true"><path d="M'+x(y,1).toFixed(1)+' '+y.toFixed(1)+'L'+x(y,0).toFixed(1)+' '+y.toFixed(1)+'L74 80L46 80Z" style="fill:var(--water);opacity:.75"/><path d="M40 16L80 16L74 80L46 80Z" style="fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:round"/></svg>'}
function svgTable(){return '<svg viewBox="0 0 120 90" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><rect x="12" y="50" width="96" height="8" rx="2" style="fill:var(--wood)"/><rect x="20" y="58" width="6" height="30" style="fill:var(--wood)"/><rect x="94" y="58" width="6" height="30" style="fill:var(--wood)"/></svg>'}
function svgChair(){return '<svg viewBox="0 0 120 90" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><rect x="36" y="4" width="6" height="46" style="fill:var(--wood)"/><rect x="36" y="44" width="52" height="7" rx="2" style="fill:var(--wood)"/><rect x="38" y="51" width="5" height="37" style="fill:var(--wood)"/><rect x="81" y="51" width="5" height="37" style="fill:var(--wood)"/><rect x="36" y="10" width="6" height="4" style="fill:var(--wood)"/></svg>'}
function pic(p,letter){
  var inner;
  if(p.svg==="cal")inner=svgCal(p.m,p.d);
  else if(p.svg==="cup")inner=svgCup();
  else if(p.svg==="glass")inner=svgGlass(p.lv);
  else if(p.svg==="clock")inner='<div class="withemo">'+svgClock(p.h,p.mi)+(p.w?"<span>"+p.w+"</span>":"")+"</div>";
  else if(p.svg==="table")inner='<div class="scene">'+svgTable()+'<span class="on" style="bottom:42%">'+p.on+"</span></div>";
  else if(p.svg==="chair")inner='<div class="scene">'+svgChair()+'<span class="on" style="bottom:8%;font-size:34px;left:57%">🐱</span></div>';
  else {var list=p.e;if(p.n>1){list=[];for(var i=0;i<p.n;i++)list.push(p.e[0])}inner=emo(list)}
  return '<div class="pic">'+(letter?'<span class="lt">'+letter+"</span>":"")+inner+"</div>";
}

  readForm();var name=cleanName(S.fName),mssv=S.fMssv.trim();S.fName=name;
  if(!S.sel){S.err="Hãy chọn suất thi của lớp em.";return render()}
  if(!validName(name)){S.err="Hãy ghi đầy đủ họ và tên (ít nhất 2 từ, chỉ gồm chữ cái).";return render()}
  if(!S.fPledge){S.err="Hãy đánh dấu vào ô cam kết trước khi bắt đầu.";return render()}
  var done=lsGet(doneKey(S.sel));if(done){S.res=done;S.view="result";S.err="";return render()}
  S.err="";S.busy=true;render();
  call("startExam",S.sel,name,mssv).then(function(r){S.busy=false;
    if(!r||r.error){S.err=(r&&r.error)||"Chưa tạo được đề. Thử lại.";return render()}
    var skew=Date.now()-r.now;
    S.exam={token:r.token,monRow:r.monRow||0,spec:r.spec,set:r.spec.set,sid:r.sid,cls:r.cls,name:r.name,mssv:r.mssv,start:r.start+skew,deadline:r.deadline+skew,ans:{},leaves:0};
    S.part=0;S.view="exam";clearTimeout(pollT);persist();render();window.scrollTo(0,0);
  },function(){S.busy=false;S.err="Không kết nối được máy chủ. Kiểm tra mạng rồi bấm Bắt đầu lại.";render()});
}

/* ----- Làm bài ----- */
function viewExam(){
  var ex=S.exam,L=items(ex),p=S.part,P=PARTS[p],set=ex.set;
  var h='<div class="wrap"><div class="exam"><div>';
  h+='<div class="parthead"><div class="zh">'+P.zh+"<small>"+P.r+" · "+P.t+'</small></div><div class="vi">'+P.vi+"</div></div>";
  if(ex.leaves>0)h+='<div class="warnbar">Em đã rời khỏi màn hình thi '+ex.leaves+" lần. Giáo viên đang thấy số lần này.</div>";
  if(p===0)h+='<div class="ex">'+EXAMPLES.map(function(e){return '<div class="q"><div>'+pic(e.pic)+'</div><div><div class="note">例如</div><div class="word">'+ruby(e)+'</div><div class="bub ro"><button aria-pressed="'+(e.a===1)+'" tabindex="-1">√</button><button aria-pressed="'+(e.a===0)+'" tabindex="-1">×</button></div></div></div>'}).join("")+"</div>";
  if(p===1)h+='<div class="optgrid">'+ex.spec.p2o.map(function(id,i){return pic(byId(P2[set].imgs,id).pic,LET[i])}).join("")+"</div>";
  if(p===2)h+='<div class="optlist">'+ex.spec.p3o.map(function(id,i){return "<div><b>"+LET[i]+'</b><span class="sent"><span class="zh">'+ruby(byId(P3[set].opts,id))+"</span></span></div>"}).join("")+"</div>";
  if(p===3)h+='<div class="optlist">'+ex.spec.p4o.map(function(id,i){return "<div><b>"+LET[i]+'</b><span class="sent"><span class="zh">'+ruby(byId(P4[set].opts,id))+"</span></span></div>"}).join("")+"</div>";
  h+='<div class="qs'+(S.pyOn?"":" nopy")+'">';
  L.filter(function(it){return it.part===p}).forEach(function(it){var v=ex.ans[it.n];
    if(p===0){var q=byId(P1,it.id);
      h+='<div class="q p1" id="q'+it.n+'"><span class="no">'+it.n+".</span>"+pic(q.pic)+'<div class="word">'+ruby(q)+'</div><div class="bub" role="group" aria-label="Câu '+it.n+'"><button data-q="'+it.n+'" data-v="1" aria-pressed="'+(v===1)+'" aria-label="Đúng">√</button><button data-q="'+it.n+'" data-v="0" aria-pressed="'+(v===0)+'" aria-label="Sai">×</button></div></div>'}
    else{var src=p===1?P2:p===2?P3:P4,q2=byId(src[set].q,it.id),fill="";
      if(p===3&&v!==undefined)fill=ruby(byId(P4[set].opts,ex.spec.p4o[v]));
      h+='<div class="q" id="q'+it.n+'"><div class="sent"><span class="no">'+it.n+'.</span><span class="zh">'+rb(q2.hz,q2.py,fill)+'</span></div><div class="bub" role="group" aria-label="Câu '+it.n+'">'+[0,1,2,3,4,5].map(function(k){return '<button data-q="'+it.n+'" data-v="'+k+'" aria-pressed="'+(v===k)+'">'+LET[k]+"</button>"}).join("")+"</div></div>"}
  });
  h+='</div><div class="pager"><button class="btn ghost" data-act="prev"'+(p===0?" disabled":"")+'>← Phần trước</button>'+(p<3?'<button class="btn" data-act="next">Phần tiếp theo →</button>':'<button class="btn red" data-act="askSubmit">Nộp bài</button>')+"</div></div>";
  var answered=Object.keys(ex.ans).length;
  h+='<aside class="card"><h3>答题卡 · Phiếu trả lời</h3>';
  ["Phần 1","Phần 2","Phần 3","Phần 4"].forEach(function(t,pi){h+='<div class="grp">'+t+'</div><div class="nav">'+L.filter(function(it){return it.part===pi}).map(function(it){return '<button data-act="jump" data-n="'+it.n+'" data-p="'+pi+'" class="'+(ex.ans[it.n]!==undefined?"done":"")+(pi===p?" cur":"")+'">'+it.n+"</button>"}).join("")+"</div>"});
  h+='<div class="cnt">Đã làm <b>'+answered+'</b>/25 câu</div><div class="stack" style="gap:8px"><button class="btn ghost small" data-act="py">'+(S.pyOn?"Ẩn pinyin":"Hiện pinyin")+'</button><button class="btn red" data-act="askSubmit">Nộp bài</button></div></aside></div></div>';
  return h;
}
function viewConfirm(){var left=25-Object.keys(S.exam.ans).length;
  return '<div class="overlay"><div class="dialog" role="dialog" aria-modal="true"><h2>Nộp bài?</h2><p>'+(left?"Em còn <b>"+left+"</b> câu chưa làm. Câu chưa làm được tính là sai.":"Em đã làm đủ 25 câu.")+' Sau khi nộp sẽ không sửa được nữa.</p><div class="row"><button class="btn ghost" data-act="cancelSubmit">Quay lại làm tiếp</button><button class="btn red" data-act="submit">Nộp bài</button></div></div></div>'}
function viewSending(){
  if(S.sending)return '<div class="overlay"><div class="dialog" role="status"><h2>Đang nộp bài…</h2><p class="note">Đừng đóng trang cho đến khi thấy điểm.</p></div></div>';
  return '<div class="overlay"><div class="dialog" role="alertdialog"><h2>Chưa nộp được bài</h2><p>'+esc(S.sendErr)+'</p><p class="note">Bài làm của em vẫn được giữ trên máy này.</p><div class="row"><button class="btn red" data-act="retry">Nộp lại</button></div></div></div>';
}
var tickT=null;
function tick(){
  clearTimeout(tickT);if(S.view!=="exam"||!S.exam)return;
  var left=S.exam.deadline-Date.now(),el=$("#timer");
  if(el){el.textContent=mmss(left);el.className="timer"+(left<60000?" crit":left<180000?" warn":"")}
  if(left<=0){if(!S.sending&&!S.sendErr)submit(true);return}
  tickT=setTimeout(tick,1000-(Date.now()%1000)+5);
  if(Date.now()-lastPing>30000)pingNow();
}
/* báo tiến độ cho trang Theo dõi của giáo viên */
var lastPing=0;
function pingNow(){var ex=S.exam;if(!ex||S.sending||!ex.token)return;lastPing=Date.now();
  call("ping",ex.token,ex.monRow,Object.keys(ex.ans).length,ex.leaves).then(function(r){if(r&&r.row&&S.exam===ex&&ex.monRow!==r.row){ex.monRow=r.row;persist()}},function(){})}
/* rời màn hình: chuyển tab/ứng dụng (điện thoại, máy tính) hoặc bấm sang cửa sổ khác quá 1,5 giây (máy tính) */
var away=false,blurT=null;
function goAway(){if(away||S.view!=="exam"||!S.exam||S.sending)return;away=true;S.exam.leaves++;persist();pingNow()}
function comeBack(){clearTimeout(blurT);if(!away)return;away=false;if(S.view==="exam"){var y=window.scrollY;render();window.scrollTo(0,y);pingNow()}}
function submit(auto){
  var ex=S.exam;if(!ex||S.sending)return;
  S.confirm=false;S.sending=true;S.sendErr="";ex.auto=ex.auto||!!auto;persist();render();
  call("submitExam",ex.token,ex.ans,ex.leaves,ex.auto,ex.monRow).then(function(r){S.sending=false;
    if(!r||r.error){S.sendErr=(r&&r.error)||"Máy chủ chưa nhận bài.";render();return}
    var done={rec:{name:ex.name,mssv:ex.mssv,cls:r.cls||ex.cls,sid:ex.sid,score:r.score,c:r.c,parts:r.parts,end:r.end,late:r.late,auto:ex.auto},exam:ex,correct:r.correct||null};
    lsSet(doneKey(ex.sid),done);lsDel(examKey());S.exam=null;S.res=done;S.view="result";clearTimeout(tickT);render();window.scrollTo(0,0);
  },function(){S.sending=false;S.sendErr="Không kết nối được máy chủ. Kiểm tra mạng rồi bấm Nộp lại.";render()});
}

/* ----- Kết quả ----- */
function viewResult(){
  var r=S.res,rec=r.rec;
  var h='<div class="wrap"><h1>Em đã nộp bài</h1><p class="lead">'+esc(rec.name)+(rec.mssv?" · "+esc(rec.mssv):"")+" · "+esc(rec.cls)+" · nộp lúc "+tstr(rec.end)+(rec.auto?" (tự nộp khi hết giờ)":"")+"</p>";
  h+='<div class="panel stack"><div class="score"><span class="n">'+fmt(rec.score)+'</span><span class="d">/ 10 điểm</span></div><p>Đúng <b>'+rec.c+"</b>/25 câu.</p>";
  h+='<div class="tbl"><table><thead><tr><th>Phần</th><th class="num">Số câu đúng</th><th class="num">Điểm</th></tr></thead><tbody>'+rec.parts.map(function(n,i){return "<tr><td>"+PARTS[i].zh+" · "+PARTS[i].t+'</td><td class="num">'+n+"/"+(i===0?10:5)+'</td><td class="num">'+fmt(n*PTS)+"</td></tr>"}).join("")+"</tbody></table></div>";
  h+='<p class="ok-t">Kết quả đã được ghi vào bảng điểm của giáo viên.</p>'+(rec.late?'<p class="bad-t">Bài được ghi nhận là nộp trễ.</p>':"")+"</div>";
  if(r.correct&&r.exam)h+=viewReview(r.exam,r.correct);
  return h+"</div>";
}
function viewReview(ex,correct){
  var L=items(ex),set=ex.set,h='<h2 style="margin-top:28px">Xem lại bài làm</h2><div class="qs review">';
  L.forEach(function(it,i){var v=ex.ans[it.n],c=correct[i],ok=v===c,txt,yours,right;
    if(it.part===0){var q=byId(P1,it.id);txt='<span class="sent"><span class="zh">'+ruby(q)+'</span></span> <span class="note">'+esc(q.vi)+"</span>";yours=v===undefined?"—":v?"√":"×";right=c?"√":"×"}
    else{var src=it.part===1?P2:it.part===2?P3:P4,q2=byId(src[set].q,it.id);txt='<span class="sent"><span class="zh">'+rb(q2.hz,q2.py)+'</span></span> <span class="note">'+esc(q2.vi)+"</span>";yours=v===undefined?"—":LET[v];right=LET[c]}
    h+='<div class="q"><span class="no">'+it.n+".</span><div>"+txt+'<div class="note">Em chọn: <b class="'+(ok?"ok-t":"bad-t")+'">'+yours+"</b> · Đáp án: <b>"+right+"</b></div></div></div>"});
  return h+"</div>";
}

/* ========= SỰ KIỆN ========= */
app.addEventListener("submit",function(e){if(e.target.id==="startForm"){e.preventDefault();if(!S.busy)startExam()}});
app.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var q=b.getAttribute("data-q");
  if(q&&S.exam&&!S.sending){var n=+q,v=+b.getAttribute("data-v");if(S.exam.ans[n]===v)delete S.exam.ans[n];else S.exam.ans[n]=v;persist();var y=window.scrollY;render();window.scrollTo(0,y);return}
  var act=b.getAttribute("data-act");if(!act)return;
  switch(act){
  case "pick":readForm();S.sel=b.getAttribute("data-s");S.err="";render();break;
  case "next":if(S.part<3){S.part++;render();window.scrollTo(0,0)}break;
  case "prev":if(S.part>0){S.part--;render();window.scrollTo(0,0)}break;
  case "jump":S.part=+b.getAttribute("data-p");render();var el=document.getElementById("q"+b.getAttribute("data-n"));if(el)el.scrollIntoView({block:"center"});break;
  case "py":S.pyOn=!S.pyOn;var y2=window.scrollY;render();window.scrollTo(0,y2);break;
  case "askSubmit":S.confirm=true;render();break;
  case "cancelSubmit":S.confirm=false;render();break;
  case "submit":submit(false);break;
  case "retry":S.sendErr="";submit(S.exam&&S.exam.auto);break;
  }
});
document.addEventListener("visibilitychange",function(){if(document.hidden)goAway();else comeBack()});
window.addEventListener("blur",function(){clearTimeout(blurT);blurT=setTimeout(function(){if(!document.hasFocus())goAway()},1500)});
window.addEventListener("focus",comeBack);
boot();
})();
</script>
</body>
</html>
